# プロンプトの先頭に余分な空行を入れない
add_newline = false

# 左側に表示する情報
format = """
$directory\
$git_branch\
$git_status\
$status\
$line_break\
$character
"""

# 右側にコマンド実行時間
right_format = "$cmd_duration"

# --------------------------------------------------
# 現在のディレクトリ
# --------------------------------------------------

[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
style = "bold cyan"

# --------------------------------------------------
# Gitブランチ
# --------------------------------------------------

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"
truncation_length = 32
truncation_symbol = "…"

# --------------------------------------------------
# Gitの変更状態
# --------------------------------------------------

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# --------------------------------------------------
# コマンド実行時間
# 1秒以上かかった場合だけ表示
# --------------------------------------------------

[cmd_duration]
min_time = 1000
format = "took [$duration]($style) "
style = "bold yellow"

# --------------------------------------------------
# コマンドの終了コード
# 成功時は非表示、失敗時だけ表示
# --------------------------------------------------

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

# --------------------------------------------------
# 入力位置
# 成功なら緑、失敗なら赤
# --------------------------------------------------

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
